name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Kiratracker
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://kiratracker.onrender.com/status)
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Warning: service returned $status"
            exit 1
          fi
