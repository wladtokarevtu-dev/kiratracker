<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kira – Gassi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EF;
  --card:#FFFFFF;
  --ink:#1A1A1A;
  --ink-2:#4B4B4B;
  --ink-3:#8A8A8A;
  --ink-4:#B8B4AC;
  --rule:#ECE8E1;
  --pill:#F0EDE6;
  --pill-hover:#E6E2DA;
  --done:#2F7A4F;
  --done-soft:#E3F1E8;
  --done-border:#CFE3D5;
  --sh:0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.04);
  --r:18px;
  --r-lg:24px;
}
body.dark{
  --bg:#0E0E0F;
  --card:#1A1A1B;
  --ink:#F2F0EB;
  --ink-2:#C7C4BC;
  --ink-3:#8C8A82;
  --ink-4:#5E5D56;
  --rule:#26262A;
  --pill:#26262A;
  --pill-hover:#34343A;
  --done:#7FD19E;
  --done-soft:#1E2A22;
  --done-border:#2F4A39;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Inter",-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

/* ===== LAYOUT ===== */
.page{
  max-width:420px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px 24px;
  gap:0;
}

/* ===== VIEWS ===== */
.view{display:none;width:100%;flex-direction:column;align-items:center;gap:20px;text-align:center}
.view.active{display:flex}

/* ===== LOADING ===== */
.spinner{
  width:48px;height:48px;
  border:3px solid var(--rule);
  border-top-color:var(--ink-3);
  border-radius:999px;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:1rem;color:var(--ink-3);font-weight:500}

/* ===== SUCCESS ===== */
.big-emoji{font-size:4rem;line-height:1;margin-bottom:4px}
.success-name{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.success-sub{color:var(--ink-3);font-size:1rem;margin-top:6px}
.success-time{
  margin-top:16px;
  background:var(--done-soft);
  border:1.5px solid var(--done-border);
  border-radius:var(--r);
  padding:14px 20px;
  font-size:.9rem;
  color:var(--done);
  font-weight:600;
}

/* ===== PICK PERSON ===== */
.pick-title{font-size:1.5rem;font-weight:800;letter-spacing:-.025em}
.pick-sub{color:var(--ink-3);font-size:.92rem}
.name-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  width:100%;
  margin-top:4px;
}
.name-btn{
  background:var(--card);
  border:1.5px solid var(--rule);
  border-radius:var(--r);
  padding:20px 12px;
  font-size:1rem;
  font-weight:700;
  color:var(--ink);
  cursor:pointer;
  box-shadow:var(--sh);
  transition:all .15s;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.name-btn:active{transform:scale(.96);background:var(--ink);color:var(--bg)}
.name-btn .avatar{
  width:40px;height:40px;
  border-radius:999px;
  background:var(--pill);
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;font-weight:700;
  color:var(--ink-2);
}
.name-btn:active .avatar{background:rgba(255,255,255,.15);color:var(--bg)}

/* ===== ERROR ===== */
.err-icon{font-size:2.5rem}
.err-title{font-size:1.25rem;font-weight:700}
.err-sub{color:var(--ink-3);font-size:.88rem;max-width:280px}
.retry-btn{
  margin-top:8px;
  background:var(--ink);
  color:var(--bg);
  border:0;
  border-radius:999px;
  padding:12px 28px;
  font-size:.92rem;
  font-weight:600;
  cursor:pointer;
}

/* ===== WRONG PERSON ===== */
.wrong-btn{
  margin-top:4px;
  background:none;
  border:0;
  color:var(--ink-4);
  font-size:.82rem;
  cursor:pointer;
  padding:8px 16px;
  border-radius:999px;
}
.wrong-btn:hover{color:var(--ink-3);background:var(--pill)}

/* ===== DARK TOGGLE ===== */
.dark-toggle{
  position:fixed;top:16px;right:16px;
  width:36px;height:36px;
  border-radius:999px;
  background:var(--pill);
  border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;color:var(--ink-2);
}
</style>
</head>
<body>

<button class="dark-toggle" onclick="toggleDark()" title="Dark mode">🌙</button>

<div class="page">

  <!-- Loading -->
  <div id="v-loading" class="view active">
    <div class="spinner"></div>
    <div class="load-text">Einen Moment…</div>
  </div>

  <!-- Success -->
  <div id="v-success" class="view">
    <div class="big-emoji">🐕</div>
    <div class="success-name" id="success-name"></div>
    <div class="success-sub">hat Kira rausgebracht</div>
    <div class="success-time" id="success-time"></div>
    <button class="wrong-btn" id="wrong-btn" onclick="wrongPerson()">Nicht ich →</button>
  </div>

  <!-- Recent / Duplikat -->
  <div id="v-recent" class="view">
    <div class="big-emoji">⏱️</div>
    <div class="pick-title" id="recent-title"></div>
    <div class="pick-sub">wurde in den letzten 30 Minuten bereits eingetragen.</div>
    <div style="display:flex;gap:10px;width:100%;margin-top:8px">
      <button class="retry-btn" style="flex:1;margin:0" onclick="forceLog()">Trotzdem eintragen</button>
      <button class="retry-btn" style="flex:1;margin:0;background:var(--pill);color:var(--ink-2)" onclick="show('v-success')">Zurück</button>
    </div>
  </div>

  <!-- Pick person (Erstregistrierung oder Fingerprint unbekannt) -->
  <div id="v-pick" class="view">
    <div class="big-emoji">👋</div>
    <div class="pick-title">Wer bist du?</div>
    <div class="pick-sub" id="pick-sub">Einmalig auswählen – wird auf diesem Gerät gespeichert.</div>
    <div class="name-grid" id="name-grid"></div>
  </div>

  <!-- Error -->
  <div id="v-error" class="view">
    <div class="err-icon">⚠️</div>
    <div class="err-title">Fehler</div>
    <div class="err-sub" id="err-sub">Etwas ist schiefgelaufen.</div>
    <button class="retry-btn" onclick="location.reload()">Nochmal versuchen</button>
  </div>

</div>

<script>
const NAMES = ['Wlad','Mama','Ilja','Aaron','Dajen'];

// ===== Dark mode =====
function initDark() {
  const dark = localStorage.getItem('dark') === '1'
    || (!localStorage.getItem('dark') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.body.classList.add('dark');
}
function toggleDark() {
  const on = document.body.classList.toggle('dark');
  localStorage.setItem('dark', on ? '1' : '0');
}
initDark();

// ===== Views =====
function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== Fingerprinting =====

// Stabile Komponenten: NUR Hardware-Merkmale, kein Canvas (iOS Safari randomisiert Canvas seit 16.4)
function stableComponents() {
  return [
    screen.width + 'x' + screen.height,
    screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone,
    navigator.hardwareConcurrency || '?',
    navigator.language || '?',
    navigator.deviceMemory || '?',
    navigator.maxTouchPoints || '0',
  ].join('|');
}

// Volle Komponenten: stable + UserAgent (kann sich bei Browser-Updates ändern)
function fullComponents() {
  return stableComponents() + '|' + navigator.userAgent;
}

// Hash (djb2, 32-bit)
function hash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) + h) ^ str.charCodeAt(i);
    h = h >>> 0;
  }
  return h.toString(16).padStart(8, '0');
}

function getFingerprints() {
  const stable = stableComponents();
  return {
    stableHash: hash(stable),
    fullHash: hash(fullComponents())
  };
}

// ===== Format Zeit =====
function nowFormatted() {
  return new Intl.DateTimeFormat('de-DE', {
    weekday: 'long', hour: '2-digit', minute: '2-digit'
  }).format(new Date());
}

// ===== Person-Auswahl aufbauen =====
function buildNameGrid(fp, isReregister) {
  const grid = document.getElementById('name-grid');
  grid.innerHTML = '';
  if (isReregister) {
    document.getElementById('pick-sub').textContent = 'Dein Gerät wurde nicht erkannt. Bitte wähle deinen Namen.';
  } else {
    document.getElementById('pick-sub').textContent = 'Einmalig auswählen – wird auf diesem Gerät gespeichert.';
  }
  NAMES.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'name-btn';
    btn.innerHTML = `<div class="avatar">${name[0]}</div>${name}`;
    btn.onclick = () => registerAndWalk(fp, name);
    grid.appendChild(btn);
  });
}

// ===== Register + Walk =====
async function registerAndWalk(fp, person) {
  show('v-loading');
  try {
    await fetch('/nfc/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({...fp, person})
    });
    await logWalk(person);
  } catch(e) {
    showError('Verbindung fehlgeschlagen. Bitte prüfe deine Internetverbindung.');
  }
}

// ===== Walk eintragen =====
async function logWalk(person) {
  const r = await fetch('/walk', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({person, time: null})
  });
  if (!r.ok) {
    showError(await r.text() || 'Unbekannter Fehler beim Eintragen.');
    return;
  }
  showSuccess(person);
}

// ===== Views =====
function showSuccess(person) {
  document.getElementById('success-name').textContent = person;
  document.getElementById('success-time').textContent = nowFormatted();
  show('v-success');
}

function showError(msg) {
  document.getElementById('err-sub').textContent = msg;
  show('v-error');
}

// ===== Globaler State für Force-Log =====
let _currentPerson = null;

// ===== Views =====
function wrongPerson() {
  // Fingerprint neu berechnen und Namensauswahl zeigen (Re-Registrierung)
  const fp = getFingerprints();
  buildNameGrid(fp, true);
  show('v-pick');
}

async function forceLog() {
  if (!_currentPerson) return;
  show('v-loading');
  const r = await fetch('/walk', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({person: _currentPerson, time: null})
  });
  r.ok ? showSuccess(_currentPerson) : showError(await r.text() || 'Fehler');
}

// ===== Main =====
async function main() {
  const fp = getFingerprints();
  try {
    const r = await fetch('/nfc/walk', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(fp)
    });

    const data = await r.json();

    if (data.status === 'logged') {
      _currentPerson = data.person;
      showSuccess(data.person);
    } else if (data.status === 'recent') {
      _currentPerson = data.person;
      document.getElementById('recent-title').textContent = data.person;
      // Erfolgs-Screen trotzdem zeigen (wird schon eingetragen gehabt)
      showSuccess(data.person);
      // Kurz danach auf recent wechseln
      setTimeout(() => {
        document.getElementById('recent-title').textContent = data.person;
        show('v-recent');
      }, 300);
    } else if (data.status === 'unknown') {
      buildNameGrid(fp, false);
      show('v-pick');
    } else {
      showError('Unbekannte Antwort vom Server.');
    }
  } catch(e) {
    showError('Verbindung zum Server nicht möglich. Bitte prüfe deine Internetverbindung.');
  }
}

main();
</script>
</body>
</html>
